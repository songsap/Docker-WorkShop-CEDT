
services:
  web:
    # Step 5a: Build image and expose port
    build: .
    ports:
      - "3000:3000"

    # Step 5b: Connect to PostgreSQL
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/workshop

    # Step 5c: Wait for database health
    depends_on:
      db:
        condition: service_healthy

  db:
    # Step 5d: PostgreSQL image and healthcheck
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workshop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

    # Step 5e and 5g: Persistent and initialization volumes
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    # Step 5f: PostgreSQL environment
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workshop

# Step 5h: Named volume
volumes:
  pgdata:
